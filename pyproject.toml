[project]
name = "model-verifier"
version = "0.1.0"
description = "Black-box AI model verification core and probing engine for OpenAI & Anthropic compatible gateways by Eka Syarif Maulana"
readme = "README.md"
authors = [
  { name = "Eka Syarif Maulana", email = "eka.ckp16799@gmail.com" }
]
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/dresar/model-verifier"
Issues = "https://github.com/dresar/model-verifier/issues"


[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "respx>=0.21.0",
]

[project.scripts]
model-verifier = "model_verifier.cli:main"
model-verifier-demo = "model_verifier.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
